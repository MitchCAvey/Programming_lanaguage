<!DOCTYPE html>
<!-- 
This showcases inline styles (CSS)
<html lang="en" style="background:blue">
-->
<html lang="en">
  <head>
    <!-- This show cases internal styles (CSS)
        <style>
            html{background:red;}
        </style>
        -->
    <link rel="stylesheet" href="./styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Site Name</title>
  </head>

  <body>
    <!-- Use the action attributes to send the completed form to a specific file. 
        like filename.php, filename.py, etc.
        
        We also have the method attributes, that will indicate if the data in the form 
        is sensitive (POST) or not (GET)
    -->
    <form action="" method="POST" enctype="multipart/form-data">
        <label for="Username">Username:</label>
        <input type="text" id="Username" placeholder="Spongebob" minlength="6" required>
        <br>
        <label for="Password">Password:</label>
        <input type="password" id="Password" minlength="6" maxlength="15" required>
        <br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" placeholder="SSquarepants@gmail.com">
        <br>
        <label for="Phone">Phone #:</label>
        <input type="tel" id="Phone" placeholder="XXX-XXX-XXXX" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        <br>
        <label for="Bday">Birth Date:</label>
        <input type="date" id="Bday">
        <br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="0" max="99" value="0">
        <br>
        <label for="title">Title:</label>

        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr" value="Mr." name="title">
        <label for="Ms">Ms.</label>
        <input type="radio" id="Ms" value="Ms." name="title">
        <label for="phd">PhD</label>
        <input type="radio" id="phd" value="PhD" name="title">
        
        <br>
        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="Mastercard">Master Card</option>
            <option value="Giftcard">Giftcard</option>
        </select>
        <br>

        <label for="subscribe">Subscribe</label>
        <input type="checkbox" id="subscribe">
        <br>

        <label for="comment">comment:</label>
        <textarea id="comment" rows="3" cols="25"></textarea>
        <br>

        <label for="file">file:</label>
        <!-- <input type="file" id="file"> -->
        <input type="file" id="file" accept="image/png,jpeg,docx">
        

        <br>
        <input type="reset">
        <br>
        <input type="submit">
    
    </form>

  </body>
</html>
