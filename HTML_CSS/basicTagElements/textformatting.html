<!DOCTYPE html>
<!-- 
This showcases inline styles (CSS)
<html lang="en" style="background:blue">
-->
<html lang="en">
  <head>
    <!-- This show cases internal styles (CSS)
        <style>
            html{background:red;}
        </style>
        -->
    <link rel="stylesheet" href="./styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Site Name</title>
  </head>

  <body>
    <p>This is normal text</p>
    <p>This is <b>bold</b> text</p>
    <p>This is <i>italic</i>i text</p>
    <p>This is <u>underlined</u> text</p>
    <p>This is <del>deleted</del> text</p>
    <p>This is <big>big</big> text</p>
    <p>This is <small>small</small> text</p>
    <p>This is <sub>subscript</sub> text</p>
    <p>This is <sup>superscript</sup> text</p>
    <p>This is <tt>monospaced</tt> text</p>
    <p>This is <mark style="background-color: darkgreen;">normal</mark> text</p>
  </body>
</html>
